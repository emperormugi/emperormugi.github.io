name: Deploy Macro Log to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - macro-log-updated.zip
      - .github/workflows/deploy.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Extract app source
        run: unzip -q macro-log-updated.zip -d app

      - name: Configure static SPA shell for GitHub Pages
        run: |
          python3 - <<'PY'
          from pathlib import Path

          config = Path("app/vite.config.ts")
          source = config.read_text(encoding="utf-8")
          if "spa:" not in source:
              marker = 'server: { entry: "server" },'
              if marker not in source:
                  raise SystemExit("Could not locate the TanStack Start server config in vite.config.ts")
              source = source.replace(
                  marker,
                  marker + '\n    // Produce a static app shell for GitHub Pages.\n    spa: { enabled: true, prerender: { outputPath: "/index.html" } },',
                  1,
              )
              config.write_text(source, encoding="utf-8")
          print("Static SPA shell configuration is ready.")
          PY

      - name: Install dependencies
        working-directory: app
        run: bun install --frozen-lockfile

      - name: Build static site
        working-directory: app
        run: bun run build

      - name: Verify static output
        run: |
          if [ ! -f app/.output/public/index.html ]; then
            echo "Expected app/.output/public/index.html after the build, but it was not found."
            echo "Build output listing:"
            find app/.output -maxdepth 4 -type f 2>/dev/null | head -100 || true
            exit 1
          fi
          touch app/.output/public/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: app/.output/public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
